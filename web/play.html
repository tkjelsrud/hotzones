<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#15110f">
  <title>Hotzones</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="play">
  <form id="join" class="panel" hidden>
    <div class="brand"><img src="logo.svg" alt="" width="48" height="48"><h1>Join</h1></div>
    <label class="field">Room code
      <input id="code" autocomplete="off" autocapitalize="characters" maxlength="5" placeholder="ABCDE">
    </label>
    <button>Join</button>
  </form>

  <main id="game" class="game" hidden>
    <canvas id="pad"></canvas>
    <div class="status"><span id="room"></span><span id="people"></span></div>
  </main>

  <section id="message" class="panel" hidden>
    <div class="brand"><img src="logo.svg" alt="" width="48" height="48"><h2 id="message-title"></h2></div>
    <p id="message-text"></p>
  </section>

  <script type="module" src="js/play.js"></script>
</body>
</html>
